<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Grocery Delivery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>🛒 Online Grocery Delivery</h1>
        <p>Fresh groceries delivered to your door</p>
    </header>

    <main>
        <section class="hero">
            <h2>Welcome to Grocery Store</h2>
            <button onclick="loadProducts()">View Products</button>
        </section>

        <section>
            <h2>Products</h2>
            <div id="products" class="products">
                <p>Click "View Products" to load products.</p>
            </div>
        </section>

        <section>
            <h2>Services</h2>

            <div class="service-box">
                <div>👤 Customer</div>
                <div>🛒 Cart</div>
                <div>📦 Orders</div>
                <div>🚚 Delivery</div>
            </div>
        </section>
    </main>

    <footer>
        <p>Online Grocery Delivery Platform | M.Sc. IT CND Project</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
